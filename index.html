<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VYBE | Chat & Calls</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#e9e9f2;background:#101116}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:9px;background:#353747;color:#fff;padding:10px}button:hover{background:#50536a}.app{display:grid;grid-template-columns:72px 245px 1fr;height:100dvh}.rail{background:#15161e;padding:14px 10px;display:flex;flex-direction:column;gap:12px}.logo{background:#7867fa;font-size:24px;font-weight:900;text-align:center;padding:12px 0;border-radius:17px}.server{height:50px;border-radius:16px;font-weight:700}.side{background:#1d1e28;padding:18px 12px;display:flex;flex-direction:column;gap:8px}.side h3{margin:8px}.side button{text-align:left;background:transparent}.side button:hover,.side button.active{background:#343648}.main{display:flex;flex-direction:column;min-width:0}.top{border-bottom:1px solid #30313e;padding:18px;font-weight:750;display:flex;justify-content:space-between}.messages{flex:1;overflow:auto;padding:24px}.msg{margin:0 0 20px;overflow-wrap:anywhere}.msg strong{color:#ad9eff}.msg small{color:#898ba2;margin-left:10px}.compose{display:flex;gap:10px;padding:18px}.compose input,.modal input{background:#2b2d3b;border:1px solid #44465b;border-radius:9px;color:white;padding:13px;min-width:0}.compose input{flex:1}.primary{background:#7867fa}.muted{color:#999bb1;font-size:13px}.user{margin-top:auto;background:#292b39;border-radius:10px;padding:12px}.modalbg{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:4}.modal{background:#222431;padding:25px;border-radius:16px;width:min(94vw,430px);display:grid;gap:12px}.modal h2{margin:0}.hidden{display:none!important}.call{position:fixed;inset:0;background:#101116;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}.videos{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;width:100%}video{background:#272939;border-radius:16px;width:min(46vw,480px);aspect-ratio:16/10;object-fit:cover}.callcontrols{display:flex;gap:12px}.danger{background:#d64558}@media(max-width:700px){.app{grid-template-columns:54px 130px 1fr}.rail{padding:8px 4px}.side{padding:10px 5px}.side h3{font-size:14px}.top{padding:12px}.messages{padding:12px}.compose{padding:8px}.compose button{padding:8px}.msg{font-size:14px}}
.call{inset:auto 14px 84px auto;width:min(460px,calc(100vw - 28px));height:auto;max-height:62dvh;z-index:3;border:1px solid #454660;border-radius:16px;box-shadow:0 14px 48px #0009;padding:14px;justify-content:flex-start;overflow:auto}.call h2{font-size:16px;margin:0}.videos video{width:min(45%,200px);min-width:110px}.callcontrols{flex-wrap:wrap;justify-content:center}.callcontrols button{padding:9px}.incoming{position:fixed;top:15px;right:15px;z-index:9;background:#292c40;border:1px solid #8d80fa;border-radius:14px;padding:18px;width:min(360px,90vw);box-shadow:0 10px 30px #000a}.incoming button{margin:8px 6px 0 0}.side #rooms{overflow:auto}.msg strong{color:#c6bbff}.room-tools{display:flex;gap:6px;align-items:center}.room-tools button{font-size:12px}.top{gap:8px;align-items:center}.top>span:last-child{display:flex;flex-wrap:wrap;gap:5px}@media(max-width:700px){.call{inset:auto 5px 77px 5px;width:auto;max-height:50dvh}.videos video{min-width:100px}.top{flex-wrap:wrap}.side{min-width:0}.side button{overflow-wrap:anywhere}}</style></head><body>
<div class="app"><aside class="rail"><div class="logo">V</div><button class="server" id="home">DM</button><button class="server" id="newRoom" title="Create server">+</button><button class="server" id="joinServer" title="Join server">↳</button></aside><aside class="side"><h3>VYBE</h3><button id="newDm">+ New DM</button><button id="newGroup">+ Group chat</button><div class="muted">YOUR ROOMS</div><div id="rooms"></div><div class="user"><div id="identity">Not signed in</div><button id="signout">Sign out</button></div></aside><main class="main"><header class="top"><span id="roomTitle">Select a room</span><span class="room-tools"><button id="inviteCode" class="hidden">Invite code</button></span><span><button id="voice">☎ Voice</button> <button id="video">▣ Video</button></span></header><section id="messages" class="messages"><p class="muted">Select a room to start chatting.</p></section><form id="send" class="compose"><input id="message" placeholder="Message your friends…" autocomplete="off" maxlength="2000"><button class="primary">Send</button></form></main></div>
<div class="modalbg" id="auth"><form class="modal" id="authform"><h2>Welcome to VYBE</h2><p class="muted">Use a username and password. No phone number or email needed.</p><input id="username" type="text" maxlength="24" autocomplete="username" placeholder="Username (3–24 letters, numbers or _)" required><input id="password" type="password" minlength="8" autocomplete="current-password" placeholder="Password (8+ characters)" required><button type="submit" class="primary" id="login">Sign in</button><button type="button" id="signup">Create account</button><p id="authError" class="muted" role="status" aria-live="polite"></p></form></div>
<div class="modalbg hidden" id="create"><form class="modal" id="createform"><h2 id="createTitle">New room</h2><input id="roomName" placeholder="Room name" required><input id="invite" placeholder="Friend usernames, comma separated (optional)"><button class="primary">Create</button><button type="button" id="cancel">Cancel</button><p class="muted">Friends must have VYBE accounts first.</p></form></div>
<div class="incoming hidden" id="incoming"><strong id="incomingTitle">Incoming call</strong><div><button id="acceptCall" class="primary">Answer</button><button id="declineCall">Dismiss</button></div></div><div class="call hidden" id="call"><h2 id="callTitle">Call</h2><div class="videos"><video id="local" autoplay playsinline muted></video><video id="remote" autoplay playsinline></video></div><div class="callcontrols"><button id="mute">Mute</button><button id="camera">Camera off</button><button id="shareScreen">Share screen</button><button class="danger" id="hangup">Leave</button></div><p class="muted" id="callStatus">Connecting…</p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const createClient=window.supabase?.createClient;
const CONFIG={url:'https://wvfpebhagyllxdyubzcb.supabase.co',key:'sb_publishable_355EUOsgzZN_U6PTaOwmQQ_-0zkPCWj'};
const $=id=>document.getElementById(id),configured=!CONFIG.url.includes('_HERE'),sb=configured&&createClient?createClient(CONFIG.url,CONFIG.key):null;
let user,room,rooms=[],subscription,callChannel,pc,stream,callId,kind='room',callMode='video',incomingChannel,pendingCall,screenStream;const nameCache=new Map();
function note(t){alert(t)}function show(id,yes=true){$(id).classList.toggle('hidden',!yes)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
if(!sb){$('authError').textContent='Supabase failed to load. Sign-in is unavailable.'}
// Internal account address is derived deterministically from the username.
// This is an identifier, not a working mailbox. Never send recovery email to it.
const internalEmail=name=>name.toLowerCase()+'@users.vybe.example.com';
function credentials(){const name=$('username').value.trim().toLowerCase(),password=$('password').value;if(!/^[a-z0-9_]{3,24}$/.test(name))throw Error('Username must be 3–24 letters, numbers or underscores.');if(password.length<8)throw Error('Password must have at least 8 characters.');return {name,password,email:internalEmail(name)}}
let busy=false;
async function authAction(create){if(busy)return;const out=$('authError');try{if(!sb)throw Error('Supabase did not load. Check your connection and reload.');const {name,password,email}=credentials();busy=true;$('login').disabled=$('signup').disabled=true;out.textContent=create?'Creating account…':'Signing in…';if(create){const response=await fetch(CONFIG.url+'/functions/v1/vybe-register',{method:'POST',headers:{'Content-Type':'application/json','apikey':CONFIG.key},body:JSON.stringify({username:name,password})});const result=await response.json();if(!response.ok)throw Error(result.error||'Registration failed');out.textContent='Account created. Signing you in…'}const result=await sb.auth.signInWithPassword({email,password});if(result.error)throw result.error;out.textContent='Success!';}catch(e){out.textContent=e.message||'Authentication failed.'}finally{busy=false;$('login').disabled=$('signup').disabled=false}}
$('authform').onsubmit=e=>{e.preventDefault();authAction(false)};
$('signup').onclick=()=>authAction(true);
$('signout').onclick=async()=>{await sb?.auth.signOut();user=null;room=null;rooms=[];$('rooms').innerHTML='';$('messages').innerHTML='';show('auth')};

async function loadRooms(){if(!user)return;{const {data,error}=await sb.from('room_members').select('room_id,rooms(id,name,kind)').eq('user_id',user.id);if(error)return note(error.message);rooms=(data||[]).map(x=>x.rooms).filter(Boolean)}$('rooms').innerHTML='';rooms.forEach(r=>{const b=document.createElement('button');b.textContent=(r.kind==='dm'?'@ ':'# ')+r.name;b.className=r.id===room?.id?'active':'';b.onclick=()=>openRoom(r);$('rooms').append(b)});if(!room&&rooms[0])await openRoom(rooms[0]);}
async function openRoom(r){room=r;$('roomTitle').textContent=r.name;show('inviteCode',r.kind==='room');for(const b of $('rooms').querySelectorAll('button'))b.classList.toggle('active',b.textContent===(r.kind==='dm'?'@ ':'# ')+r.name);if(subscription)await sb.removeChannel(subscription);const {data,error}=await sb.from('messages').select('id,body,created_at,sender_id').eq('room_id',r.id).order('created_at',{ascending:true}).limit(200);if(error)return note(error.message);$('messages').innerHTML='';const ids=[...new Set((data||[]).map(m=>m.sender_id))];if(ids.length){const p=await sb.from('profiles').select('user_id,display_name').in('user_id',ids);(p.data||[]).forEach(x=>nameCache.set(x.user_id,x.display_name))}(data||[]).forEach(addMessage);subscription=sb.channel('messages-'+r.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'room_id=eq.'+r.id},async p=>{const m=p.new;if(!nameCache.has(m.sender_id)){const {data}=await sb.from('profiles').select('display_name').eq('user_id',m.sender_id).maybeSingle();if(data)nameCache.set(m.sender_id,data.display_name)}addMessage(m)}).subscribe();}
function addMessage(m){const d=document.createElement('div');d.className='msg';d.innerHTML='<strong>'+esc(m.sender_id===user.id?'You':nameCache.get(m.sender_id)||'Member')+'</strong><small>'+new Date(m.created_at).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})+'</small><div>'+esc(m.body)+'</div>';$('messages').append(d);$('messages').scrollTop=$('messages').scrollHeight}
$('send').onsubmit=async e=>{e.preventDefault();const body=$('message').value.trim();if(!room||!body)return;const {error}=await sb.from('messages').insert({room_id:room.id,sender_id:user.id,body});if(error)note(error.message);else $('message').value=''};
function beginCreate(k){kind=k;$('createTitle').textContent=k==='dm'?'New direct message':k==='group'?'New group chat':'New server / room';$('roomName').value='';$('invite').value='';show('create')}
$('newRoom').onclick=()=>beginCreate('room');$('newDm').onclick=()=>beginCreate('dm');$('newGroup').onclick=()=>beginCreate('group');$('cancel').onclick=()=>show('create',false);
$('createform').onsubmit=async e=>{e.preventDefault();const name=$('roomName').value.trim(),names=$('invite').value.split(',').map(s=>s.trim().toLowerCase()).filter(Boolean);if(names.some(n=>!/^[a-z0-9_]{3,24}$/.test(n)))return note('Friend usernames must be 3–24 letters, numbers or underscores.');const emails=names.map(internalEmail);if(kind==='dm'&&emails.length!==1)return note('Enter one friend username for a DM.');const {data,error}=await sb.rpc('create_room_with_invites',{room_name:name,room_kind:kind,invite_emails:emails});if(error)return note(error.message);show('create',false);room=null;await loadRooms();const found=rooms.find(r=>r.id===data);if(found)openRoom(found)};
$('home').onclick=()=>{room=null;loadRooms()};
$('joinServer').onclick=async()=>{const code=prompt('Enter a server invite code');if(!code)return;const {data,error}=await sb.rpc('join_vybe_server',{code:code.trim()});if(error)return note(error.message);room=null;await loadRooms();const joined=rooms.find(r=>r.id===data);if(joined)openRoom(joined)};
$('inviteCode').onclick=async()=>{if(!room||room.kind!=='room')return;const {data,error}=await sb.from('rooms').select('invite_code').eq('id',room.id).single();if(error)return note(error.message);if(!data.invite_code)return note('No invite code available');try{await navigator.clipboard.writeText(data.invite_code);note('Invite code copied: '+data.invite_code)}catch{note('Server invite code: '+data.invite_code)}};
async function listenForCalls(){if(!user)return;if(incomingChannel)await sb.removeChannel(incomingChannel);incomingChannel=sb.channel('incoming-'+user.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'call_invites',filter:'recipient_id=eq.'+user.id},async p=>{const c=p.new;if(Date.now()-new Date(c.created_at).getTime()>90000||pc)return;pendingCall=c;const {data}=await sb.from('profiles').select('display_name').eq('user_id',c.caller_id).maybeSingle();$('incomingTitle').textContent=(data?.display_name||'Someone')+' is calling ('+c.mode+')';show('incoming')}).subscribe()}
$('acceptCall').onclick=async()=>{const c=pendingCall;show('incoming',false);pendingCall=null;if(!c)return;await loadRooms();const r=rooms.find(x=>x.id===c.room_id);if(!r)return note('This room is not in your list.');await openRoom(r);await startCall(c.mode,false)};
$('declineCall').onclick=()=>{pendingCall=null;show('incoming',false)};

async function startCall(mode,initiator=true){if(!room)return note('Choose a room first.');if(pc)return note('You are already in a call.');callMode=mode;callId=room.id;show('call');$('callTitle').textContent=room.name+' · '+mode;try{stream=await navigator.mediaDevices.getUserMedia({audio:true,video:mode==='video'?{width:{ideal:640},height:{ideal:360},frameRate:{ideal:15,max:24}}:false});$('local').srcObject=stream;pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});stream.getTracks().forEach(t=>pc.addTrack(t,stream));pc.ontrack=e=>$('remote').srcObject=e.streams[0];callChannel=sb.channel('call-'+callId,{config:{broadcast:{self:false}}});pc.onicecandidate=e=>{if(e.candidate)callChannel.send({type:'broadcast',event:'ice',payload:{candidate:e.candidate}})};callChannel.on('broadcast',{event:'offer'},async({payload})=>{if(pc.signalingState!=='stable')return;await pc.setRemoteDescription(payload.offer);const answer=await pc.createAnswer();await pc.setLocalDescription(answer);await callChannel.send({type:'broadcast',event:'answer',payload:{answer}});$('callStatus').textContent='Joining call…'}).on('broadcast',{event:'answer'},async({payload})=>{if(pc.signalingState==='have-local-offer')await pc.setRemoteDescription(payload.answer)}).on('broadcast',{event:'ice'},async({payload})=>{try{if(pc.remoteDescription)await pc.addIceCandidate(payload.candidate)}catch{}}).subscribe(async status=>{if(status==='SUBSCRIBED'){$('callStatus').textContent='Waiting for another person…';if(initiator){const {error:ringError}=await sb.rpc('ring_vybe_room',{p_room:callId,p_mode:mode});if(ringError)console.warn('Call notifications unavailable:',ringError.message)}if(initiator)setTimeout(async()=>{if(!pc||pc.signalingState!=='stable')return;const offer=await pc.createOffer();await pc.setLocalDescription(offer);await callChannel.send({type:'broadcast',event:'offer',payload:{offer}})},1300)}}});pc.onconnectionstatechange=()=>{$('callStatus').textContent=pc?.connectionState||'Disconnected'}}catch(e){note(e.message);endCall()}}
function endCall(){stream?.getTracks().forEach(t=>t.stop());pc?.close();if(callChannel)sb.removeChannel(callChannel);screenStream?.getTracks().forEach(t=>t.stop());screenStream=null;pc=null;stream=null;callChannel=null;$('local').srcObject=null;$('remote').srcObject=null;show('call',false)}
$('shareScreen').onclick=async()=>{if(!pc)return;try{if(screenStream){screenStream.getTracks().forEach(t=>t.stop());screenStream=null;const camera=stream?.getVideoTracks()[0]||null;const sender=pc.getSenders().find(s=>s.track?.kind==='video');if(sender)await sender.replaceTrack(camera);$('shareScreen').textContent='Share screen';return}if(!navigator.mediaDevices?.getDisplayMedia)throw Error('Screen sharing is not supported by this browser. Try desktop Chrome or Safari.');screenStream=await navigator.mediaDevices.getDisplayMedia({video:true,audio:false});const track=screenStream.getVideoTracks()[0];let sender=pc.getSenders().find(s=>s.track?.kind==='video');if(sender)await sender.replaceTrack(track);else{pc.addTrack(track,screenStream);$('callStatus').textContent='Screen share added. Rejoin the call if the other person cannot see it.'}track.onended=()=>{if(screenStream)$('shareScreen').click()};$('shareScreen').textContent='Stop sharing'}catch(e){note(e.message)}};
$('voice').onclick=()=>startCall('voice');$('video').onclick=()=>startCall('video');$('hangup').onclick=endCall;
$('mute').onclick=()=>{const t=stream?.getAudioTracks()[0];if(t){t.enabled=!t.enabled;$('mute').textContent=t.enabled?'Mute':'Unmute'}};
$('camera').onclick=()=>{const t=stream?.getVideoTracks()[0];if(t){t.enabled=!t.enabled;$('camera').textContent=t.enabled?'Camera off':'Camera on'}};
if(sb){sb.auth.onAuthStateChange((_event,session)=>{user=session?.user;if(user){user.displayName=user.user_metadata?.display_name||user.email?.split('@')[0]||'User';$('identity').textContent=user.displayName;show('auth',false);setTimeout(()=>{loadRooms().catch(e=>note(e.message));listenForCalls().catch(e=>console.warn(e))},0)}else{show('auth');$('identity').textContent='Not signed in';room=null;rooms=[];$('rooms').innerHTML='';$('messages').innerHTML='';if(incomingChannel){sb.removeChannel(incomingChannel);incomingChannel=null}endCall()}})}
</script></body></html>
