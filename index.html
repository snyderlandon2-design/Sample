$('createform').onsubmit=async e=>{e.preventDefault();const name=$('roomName').value.trim(),names=$('invite').value.split(',').map(s=>s.trim().toLowerCase()).filter(Boolean);if(names.some(n=>!/^[a-z0-9_]{3,24}$/.test(n)))return note('Friend usernames must be 3–24 letters, numbers or underscores.');const emails=names.map(internalEmail);if(kind==='dm'&&emails.length!==1)return note('Enter one friend username for a DM.');const {data,error}=kind==='dm'?await sb.rpc('create_vybe_dm',{friend_username:names[0]}):await sb.rpc('create_room_with_invites',{room_name:name,room_kind:kind,invite_emails:emails});if(error)return note(error.message);show('create',false);section=kind==='room'?'server':'dm';room=null;await loadRooms();const found=rooms.find(r=>r.id===data);if(found)openRoom(found)};
$('home').onclick=()=>{section='dm';room=null;loadRooms()};
$('joinServer').onclick=async()=>{const code=prompt('Enter a server invite code');if(!code)return;const {data,error}=await sb.rpc('join_vybe_server',{code:code.trim()});if(error)return note(error.message);section='server';room=null;await loadRooms();const joined=rooms.find(r=>r.id===data);if(joined)openRoom(joined)};
$('inviteCode').onclick=async()=>{if(!room||room.kind!=='room')return;const {data,error}=await sb.from('rooms').select('invite_code').eq('id',room.id).single();if(error)return note(error.message);if(!data.invite_code)return note('No invite code available');try{await navigator.clipboard.writeText(data.invite_code);note('Invite code copied: '+data.invite_code)}catch{note('Server invite code: '+data.invite_code)}};
async function listenForProfiles(){if(profileChannel)await sb.removeChannel(profileChannel);profileChannel=sb.channel('profile-updates-'+user.id).on('postgres_changes',{event:'UPDATE',schema:'public',table:'profiles'},async p=>{const updated=p.new;if(!updated?.user_id)return;nameCache.set(updated.user_id,updated.display_name);avatarCache.set(updated.user_id,updated.avatar_url);await loadRooms();if(room){for(const row of $('messages').querySelectorAll('.msg')){const id=row.dataset.senderId;if(id!==updated.user_id)continue;const head=row.querySelector('.msg-head');if(head){const old=head.querySelector('.avatar');if(old)old.replaceWith(avatarNode(updated.display_name,updated.avatar_url));const label=head.querySelector('strong');if(label)label.textContent=updated.display_name}}}}).subscribe()}
async function listenForCalls(){if(!user)return;if(incomingChannel)await sb.removeChannel(incomingChannel);incomingChannel=sb.channel('incoming-'+user.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'call_invites',filter:'recipient_id=eq.'+user.id},async p=>{const c=p.new;if(Date.now()-new Date(c.created_at).getTime()>90000||pc)return;pendingCall=c;const {data}=await sb.from('profiles').select('display_name').eq('user_id',c.caller_id).maybeSingle();$('incomingTitle').textContent=(data?.display_name||'Someone')+' is calling ('+c.mode+')';show('incoming')}).subscribe()}
$('acceptCall').onclick=async()=>{const c=pendingCall;show('incoming',false);pendingCall=null;if(!c)return;await loadRooms();const r=rooms.find(x=>x.id===c.room_id);if(!r)return note('This room is not in your list.');await openRoom(r);await startCall(c.mode,false)};
$('declineCall').onclick=()=>{pendingCall=null;show('incoming',false)};

async function startCall(mode,initiator=true){if(!room)return note('Choose a room first.');if(pc)return note('You are already in a call.');callMode=mode;callId=room.id;setCallButton('mute','mic','Mute microphone');setCallButton('camera',mode==='video'?'video':'videoOff',mode==='video'?'Turn camera off':'Camera unavailable',mode!=='video');setCallButton('shareScreen','screen','Share screen');show('call');$('callTitle').textContent=room.name+' · '+mode;try{stream=await navigator.mediaDevices.getUserMedia({audio:true,video:mode==='video'?{width:{ideal:1920},height:{ideal:1080},frameRate:{ideal:30}}:false});$('local').srcObject=stream;pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});stream.getTracks().forEach(t=>pc.addTrack(t,stream));pc.ontrack=e=>$('remote').srcObject=e.streams[0];callChannel=sb.channel('call-'+callId,{config:{broadcast:{self:false}}});pc.onicecandidate=e=>{if(e.candidate)callChannel.send({type:'broadcast',event:'ice',payload:{candidate:e.candidate}})};callChannel.on('broadcast',{event:'offer'},async({payload})=>{if(pc.signalingState!=='stable')return;await pc.setRemoteDescription(payload.offer);const answer=await pc.createAnswer();await pc.setLocalDescription(answer);await callChannel.send({type:'broadcast',event:'answer',payload:{answer}});$('callStatus').textContent='Joining call…'}).on('broadcast',{event:'answer'},async({payload})=>{if(pc.signalingState==='have-local-offer')await pc.setRemoteDescription(payload.answer)}).on('broadcast',{event:'ice'},async({payload})=>{try{if(pc.remoteDescription)await pc.addIceCandidate(payload.candidate)}catch{}}).subscribe(async status=>{if(status==='SUBSCRIBED'){$('callStatus').textContent='Waiting for another person…';if(initiator){const {error:ringError}=await sb.rpc('ring_vybe_room',{p_room:callId,p_mode:mode});if(ringError)console.warn('Call notifications unavailable:',ringError.message)}if(initiator)setTimeout(async()=>{if(!pc||pc.signalingState!=='stable')return;const offer=await pc.createOffer();await pc.setLocalDescription(offer);await callChannel.send({type:'broadcast',event:'offer',payload:{offer}})},1300)}});pc.onconnectionstatechange=()=>{$('callStatus').textContent=pc?.connectionState||'Disconnected'}}catch(e){note(e.message);endCall()}}
function endCall(){stream?.getTracks().forEach(t=>t.stop());pc?.close();if(callChannel)sb.removeChannel(callChannel);screenStream?.getTracks().forEach(t=>t.stop());screenStream=null;pc=null;stream=null;callChannel=null;setCallButton('shareScreen','screen','Share screen');$('local').srcObject=null;$('remote').srcObject=null;show('call',false)}
$('shareScreen').onclick=async()=>{if(!pc)return;try{if(screenStream){screenStream.getTracks().forEach(t=>t.stop());screenStream=null;const camera=stream?.getVideoTracks()[0]||null;const sender=pc.getSenders().find(s=>s.track?.kind==='video');if(sender)await sender.replaceTrack(camera);setCallButton('shareScreen','screen','Share screen');return}if(!navigator.mediaDevices?.getDisplayMedia)throw Error('Screen sharing is not supported by this browser. Try desktop Chrome or Safari.');screenStream=await navigator.mediaDevices.getDisplayMedia({video:true,audio:false});const track=screenStream.getVideoTracks()[0];let sender=pc.getSenders().find(s=>s.track?.kind==='video');if(sender)await sender.replaceTrack(track);else{pc.addTrack(track,screenStream);$('callStatus').textContent='Screen share added. Rejoin the call if the other person cannot see it.'}track.onended=()=>{if(screenStream)$('shareScreen').click()};setCallButton('shareScreen','screen','Stop sharing',true)}catch(e){note(e.message)}};
$('editAvatar').onclick=()=>$('avatarFile').click();
$('avatarFile').onchange=async e=>{const file=e.target.files?.[0];if(!file||!user)return;if(file.size>2097152)return note('Picture must be under 2 MB.');if(!['image/jpeg','image/png','image/webp'].includes(file.type))return note('Use a JPG, PNG or WebP picture.');const ext=file.type==='image/png'?'png':file.type==='image/webp'?'webp':'jpg';const path=user.id+'/profile.'+ext;const {error}=await sb.storage.from('vybe-avatars').upload(path,file,{upsert:true,contentType:file.type});if(error)return note(error.message);const url=sb.storage.from('vybe-avatars').getPublicUrl(path).data.publicUrl+'?v='+Date.now();const {error:profileError}=await sb.from('profiles').update({avatar_url:url}).eq('user_id',user.id);if(profileError)return note(profileError.message);await sb.auth.updateUser({data:{avatar_url:url}});avatarCache.set(user.id,url);await loadRooms();const my=avatarNode(user.displayName,url);$('myAvatar').replaceWith(my);my.id='myAvatar';note('Profile picture updated.');e.target.value=''};
$('voice').onclick=()=>startCall('voice');$('video').onclick=()=>startCall('video');$('hangup').onclick=endCall;
$('mute').onclick=()=>{const t=stream?.getAudioTracks()[0];if(t){t.enabled=!t.enabled;setCallButton('mute',t.enabled?'mic':'micOff',t.enabled?'Mute microphone':'Unmute microphone',!t.enabled)}};
$('camera').onclick=()=>{const t=stream?.getVideoTracks()[0];if(t){t.enabled=!t.enabled;setCallButton('camera',t.enabled?'video':'videoOff',t.enabled?'Turn camera off':'Turn camera on',!t.enabled)}};
if(sb){sb.auth.onAuthStateChange((_event,session)=>{user=session?.user;if(user){user.displayName=user.user_metadata?.display_name||user.email?.split('@')[0]||'User';$('identity').textContent=user.displayName;const my=avatarNode(user.displayName,user.user_metadata?.avatar_url);$('myAvatar').replaceWith(my);my.id='myAvatar';nameCache.set(user.id,user.displayName);avatarCache.set(user.id,user.user_metadata?.avatar_url||null);show('auth',false);setTimeout(()=>{loadRooms().catch(e=>note(e.message));listenForCalls().catch(e=>console.warn(e));listenForProfiles().catch(e=>console.warn(e))},0)}else{show('auth');$('identity').textContent='Not signed in';room=null;rooms=[];$('rooms').innerHTML='';$('messages').innerHTML='';if(incomingChannel){sb.removeChannel(incomingChannel);incomingChannel=null}if(profileChannel){sb.removeChannel(profileChannel);profileChannel=null}endCall()}})}
</script></body></html>
